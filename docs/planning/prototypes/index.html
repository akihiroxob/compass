 const query=main.querySelector('#outcome-list-query'),goal=main.querySelector('#outcome-list-goal'),blocked=main.querySelector('#outcome-list-blocked');query.value=saved?.query??'';goal.value=params.has('goal')&&currentGoals[Number(params.get('goal'))]?params.get('goal'):saved?.goal??'all';blocked.value=saved?.blocked??'all';
 const update=()=>{const q=query.value.trim().toLocaleLowerCase(),filtered=items.filter(item=>(goal.value==='all'||String(item.i)===goal.value)&&(blocked.value==='all'||(blocked.value==='blocked')===!!item.work.blockers.length)&&[item.outcome,item.g.title,item.contribution,...item.work.blockers.map(b=>b.reason)].join(' ').toLocaleLowerCase().includes(q));main.querySelector('#outcome-list-count').textContent=filtered.length+'件';
 main.querySelector('#outcome-list').innerHTML=filtered.length?filtered.map(item=>{const {work}=item,b=work.blockers[0];return `<article class="panel outcome-list-row"><div class="outcome-list-purpose"><p class="outcome-list-goal"><a href="#workspace/${w.id}/goals/${item.i}">${item.g.title}</a></p><h2><a href="#workspace/${w.id}/outcomes/${item.i}">${item.outcome}</a></h2><p>${item.contribution}</p>${outcomeStatus(item.delivery,item.effect)}<div class="activity-references">${work.projects.map((name,p)=>`<a href="#workspace/${w.id}/project/${p}">${name}</a>`).join('')}</div></div><div class="outcome-list-progress"><h3>Task進捗</h3><strong>${work.percent===null?'—':work.percent+'%'}</strong><p>受入済み ${work.accepted} / ${work.total}件</p>${work.percent===null?'<p>Task未起票</p>':`<div class="meter"><span style="width:${work.percent}%"></span></div>`}</div><div class="outcome-list-blockers"><h3>止まっている問題</h3>${b?`<span class="badge warning">${b.human?'対応待ち':'Agentが対処'}</span><p>${b.reason}</p><a href="#workspace/${w.id}/outcomes/${item.i}">${work.blockers.length>1?'ほか'+(work.blockers.length-1)+'件':'詳細を見る'}</a>`:'<p class="muted">なし</p>'}</div></article>`}).join(''):items.length?'<section class="panel"><p>条件に一致するOutcomeはありません。</p></section>':`<section class="panel empty-state"><h2>Outcomeはまだありません</h2><a class="button-link" href="#workspace/${w.id}/goals/new">目標を作成</a></section>`;
 outcomeListState.set(w.id,{query:query.value,goal:goal.value,blocked:blocked.value});};
 main.querySelector('#outcome-list-filters').onsubmit=e=>e.preventDefault();query.oninput=update;goal.onchange=update;blocked.onchange=update;main.querySelector('#outcome-list-reset').onclick=()=>{main.querySelector('#outcome-list-filters').reset();update()};update();

function outcomePage(w,index){

 <section class="outcome-problems"><div class="section-heading"><h2>解決したい課題</h2><span class="muted">${problems.length}件</span></div><div class="problem-list">${problems.map((p,n)=>`<article class="panel problem-card"><header class="problem-heading"><h3>${p.title}</h3><span class="badge">${p.state}</span></header><div class="problem-sections"><section class="problem-evidence"><h4>根拠</h4><p>${p.evidence}</p><button class="text-button" data-evidence="${n}">根拠を確認</button></section><section class="problem-solution"><h4>解決策</h4><div class="solution-title"><strong>${p.solution}</strong><span class="badge">${p.solutionState}</span></div><p>${p.hypothesis}</p><details class="evaluation-plan"><summary>評価計画</summary><dl>${[['確かめること',p.question],['方法',p.method],['判断する条件',p.decision],['観測・中止の条件',p.timing]].map(([label,value])=>`<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl></details><div class="evaluation-result"><h4>評価結果 <span class="badge">${delivered?effect:'未実施'}</span></h4><p>${result}</p></div></section></div></article>`).join('')}</div></section>
 <section class="outcome-projects"><div class="section-heading"><h2>関連するプロダクト</h2></div><div class="panel">${related.map((name,n)=>`<div class="project-row"><a href="#workspace/${w.id}/project/${n}">${name}</a><span class="badge">${delivered?'提供済み':n===0?'検証中':'開発中'}</span></div>`).join('')}</div></section>`;

function render(){closeMenu();document.querySelector('#menu-button').hidden=true;if(dialog.open)dialog.close();const parts=location.hash.slice(1).split('/');if(parts[0]!=='workspace'){home(parts[0]==='empty-workspaces');return}if(parts[1]==='new'){root.innerHTML='<main class="main creation-main"></main>';creationFormPage('workspace');return}if(parts[1].startsWith('preview-')&&!creationSamples.has(parts[1])){root.innerHTML='<main class="main creation-main"><h1>プレビューは終了しました</h1><a class="button-link" href="#workspace/new">Workspaceを作成</a></main>';return}const w=workspaceSamples().find(x=>x.id===parts[1])??data[0];currentGoals=w.isNewWorkspace?[]:otherGoals[w.id]?otherGoals[w.id].map((g,i)=>({...goals[i],...g,summary:g.change+'の変化を観測しています。',hypothesis:'効果との関係は確認中です。',projects:w.projects.join('・'),action:'利用体験の改善'})):goals;activeWorkspace=w.id;const project=parts[2]==='project'?(parts[3]??'0'):null;const view=['development','releases','settings'].includes(parts[4])?parts[4]:'overview';root.innerHTML=shell(w,project,view);document.querySelector('#menu-button').hidden=false;if(project!==null){if(view==='overview'&&w.emptyProjectIndexes?.includes(Number(project)))projectEmptyPage(w,project);else if(view==='settings')projectSettingsPage(w,project,parts[5]);else if(view==='releases')releasePage(w,project,parts[5]);else if(view==='development')developmentPage(w,project,parts[5],parts[6]);else projectPage(w,project,view);}else if(parts[2]==="projects"&&parts[3]==="new")creationFormPage('project',w);else if(w.isNewWorkspace&&['human','agents'].includes(parts[2])&&!parts[3])workspaceEmptyPage(w,parts[2]);else if(w.isNewWorkspace&&parts[2]==='settings'&&parts[3]==='members')workspaceEmptyPage(w,'members');else if(parts[2]==="goals"&&parts[4]==="outcomes"&&parts[5]==="new")outcomeFormPage(w,parts[3]);else if(parts[2]==="goals"&&parts[3]==="new")goalFormPage(w);else if(parts[2]==="goals"&&parts[4]==="edit")goalFormPage(w,parts[3]);else if(parts[2]==="goals")goalPage(w,parts[3]);els
